<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GI II Exam</title>
  <meta name="description" content="Self-study quiz app for the GI Block II exam — 436 case-based MCQs with instant feedback and topic filtering." />
  <meta name="theme-color" content="#0d3b52" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="progress-block">
        <div class="progress" id="progress"></div>
        <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false">
          Filter topics <span id="filterCount"></span>
        </button>
      </div>
      <div class="score">
        <div class="score-label">All-time accumulated score</div>
        <div class="score-value"><span id="score">0</span> PTS</div>
      </div>
    </header>

    <div class="stats-bar" id="statsBar" role="img" aria-label="">
      <div class="stats-seg correct" id="statCorrect"></div>
      <div class="stats-seg wrong" id="statWrong"></div>
      <div class="stats-seg unseen" id="statUnseen"></div>
    </div>
    <div class="stats-legend" id="statsLegend">
      <span class="legend-item correct"><i></i>Correct <b id="statCorrectN">0</b></span>
      <span class="legend-item wrong"><i></i>Wrong <b id="statWrongN">0</b></span>
      <span class="legend-item unseen"><i></i>Unseen <b id="statUnseenN">0</b></span>
    </div>

    <section class="filter-panel" id="filterPanel" hidden>
      <div class="filter-panel-head">
        <span>Show questions from</span>
        <div class="filter-panel-actions">
          <button type="button" id="filterAll">All</button>
          <button type="button" id="filterNone">None</button>
        </div>
      </div>
      <ul class="filter-list" id="filterList"></ul>
    </section>

    <section class="case">
      <figure class="figure" id="figure">
        <div class="figure-frame" id="figureFrame"></div>
        <figcaption id="figCaption"></figcaption>
      </figure>
      <div class="divider" aria-hidden="true"></div>
      <div class="stem">
        <div class="eyebrow" id="eyebrow">Case study • Question</div>
        <p class="question" id="question"></p>
      </div>
    </section>

    <div class="options-wrap" id="optionsWrap">
      <ol class="options" id="options" role="listbox" aria-label="Answer choices"></ol>
      <div class="reveal-gate" id="revealGate">
        <button class="reveal-btn" id="revealBtn" type="button">Show answer choices</button>
        <p class="reveal-note">Choice lengths are hidden until you reveal them, so you read every option before any one visibly stands out.</p>
      </div>
    </div>

    <section class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <p class="explanation" id="explanation"></p>
    </section>

    <footer class="actions">
      <span class="hint" id="hint">Reveal choices, then A–E to choose, Enter to submit</span>
      <button class="btn" id="submitBtn" disabled>Submit answer</button>
    </footer>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
